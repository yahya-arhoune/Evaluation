# src/main/resources/application2.properties
# Database connection settings for Exercise 2 (for MySQL, adjust if using another DB)
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/projet_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
hibernate.connection.username=root
hibernate.connection.password=Yahya123@@

# Hibernate Dialect
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Show SQL queries in console
hibernate.show_sql=true

# Format SQL queries for readability
hibernate.format_sql=true

# HBM2DDL - automatically create/update database schema
hibernate.hbm2ddl.auto=update # Use 'update' to avoid dropping the database on every run

