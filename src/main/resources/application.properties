# src/main/resources/application.properties
# Database connection settings (for MySQL, adjust if using another DB)
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/stock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=truehibernate.connection.username=root
hibernate.connection.password=Yahya123@@

# Hibernate Dialect
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Show SQL queries in console
hibernate.show_sql=true

# Format SQL queries for readability
hibernate.format_sql=true

# HBM2DDL - automatically create/update database schema
# 'create' will drop and re-create the schema on startup (useful for development)
# 'update' will update the schema (safer for existing data)
# 'validate' will only validate the schema, not modify
# 'none' will do nothing
hibernate.hbm2ddl.auto=update

# Other settings (optional)
hibernate.c3p0.min_size=5
hibernate.c3p0.max_size=20
hibernate.c3p0.timeout=300
hibernate.c3p0.max_statements=50
hibernate.c3p0.idle_test_period=3000